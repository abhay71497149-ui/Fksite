<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saimart</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{
    scroll-behavior:smooth;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#6500ff;
    color:#fff;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    background:linear-gradient(180deg,#6200ff 0%,#6500ff 100%);
    padding:8px 20px 30px;
}

/* ================= TOP TABS ================= */

.top-tabs{
    display:flex;
    gap:32px;
    padding:68px 38px 68px;
}

.tab{
    height:118px;
    flex:1;
    border-radius:32px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#333;
    font-size:34px;
    font-weight:700;
    cursor:pointer;
}

.tab:first-child{
    background:#ffe000;
    border:2px solid #ffd400;
}

.tab .icon{
    font-size:50px;
    margin-right:18px;
}

.tab:first-child .icon{
    font-size:52px;
    color:#1769aa;
    font-weight:900;
}

/* ================= HOME ================= */

.home-row{
    display:flex;
    gap:18px;
    margin:0 0 28px;
}

.home{
    flex:1;
    height:98px;
    border-radius:50px;
    background:#4e00c9;
    display:flex;
    align-items:center;
    padding:0 38px;
    font-size:38px;
    font-weight:700;
    cursor:pointer;
}

.home-pin{
    font-size:30px;
    margin-right:25px;
}

.small{
    width:102px;
    height:98px;
    border-radius:28px;
    background:#4e00c9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    cursor:pointer;
}

.small:last-child{
    width:130px;
}

/* ================= SEARCH ================= */

.search-row{
    display:flex;
    align-items:center;
    gap:25px;
    margin-bottom:26px;
}

.search{
    height:130px;
    flex:1;
    background:#fff;
    border-radius:70px;
    display:flex;
    align-items:center;
    padding:0 42px;
    color:#666;
    font-size:38px;
    cursor:pointer;
}

.search-icon{
    font-size:65px;
    color:#222;
    margin-right:35px;
}

.mic{
    margin-left:auto;
    font-size:48px;
    color:#777;
}

.qr{
    font-size:58px;
    width:70px;
    text-align:center;
    cursor:pointer;
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    justify-content:space-between;
    gap:25px;
    padding:0 20px;
}

.cat{
    flex:1;
    text-align:center;
    font-size:32px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
}

.cat-box{
    height:124px;
    border:2px solid rgba(255,255,255,.3);
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
    font-size:62px;
    background:rgba(255,255,255,.025);
}

/* ================= SAIMART CONTENT ================= */

.saimart-content{
    width:100%;
    margin-top:35px;
}

/*
   CLICK AREA
   Banner + text par click karne se
   PRODUCT START SECTION tak smooth scroll hoga.
*/
.scroll-to-products{
    cursor:pointer;
}

/* ================= MAIN BANNER ================= */

.banner{
    width:100%;
    min-height:320px;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:#4d00d4;
}

.banner img{
    width:100%;
    height:100%;
    min-height:320px;
    display:block;
    object-fit:cover;
}

.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.12);
    pointer-events:none;
}

.banner-text{
    position:absolute;
    z-index:2;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    text-align:center;
    color:#fff;
    font-size:48px;
    line-height:1.15;
    font-weight:800;
    text-shadow:0 3px 8px rgba(0,0,0,.55);
}

/* ================= TEXT BELOW MAIN BANNER ================= */

.below-banner-text{
    width:100%;
    text-align:center;
    padding:25px 15px 5px;
    font-size:32px;
    line-height:1.3;
    font-weight:700;
    color:#fff;
}

/* ================= 2 BANNER SLIDER ================= */

.slider-section{
    width:100%;
    margin-top:25px;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
}

.banner-slider{
    width:100%;
    display:flex;
    gap:18px;
    animation:slideRightToLeft 12s linear infinite;
    will-change:transform;
}

.slider-banner{
    flex:0 0 calc(50% - 9px);
    height:220px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#fff;
}

.slider-banner img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

/*
   Duplicate banners allow continuous
   right-to-left movement.
*/
@keyframes slideRightToLeft{
    0%{
        transform:translateX(0);
    }
    100%{
        transform:translateX(calc(-50% - 9px));
    }
}

/* ================= PRODUCT START ================= */

.product-start{
    width:100%;
    margin-top:40px;
    padding:28px 20px 60px;
    border-radius:25px;
    background:rgba(0,0,0,.12);
    scroll-margin-top:15px;
}

.product-start-title{
    text-align:center;
    font-size:36px;
    font-weight:800;
    margin-bottom:25px;
}

.product-placeholder{
    min-height:180px;
    border:2px dashed rgba(255,255,255,.45);
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:25px;
    font-weight:600;
}

/*
==================================================
SAIMART SETTINGS

MAIN BANNER:
#saimartBanner

MAIN BANNER TEXT:
#bannerText

TEXT BELOW MAIN BANNER:
#belowBannerText

SLIDER BANNER 1:
#sliderBanner1

SLIDER BANNER 2:
#sliderBanner2

PRODUCT START:
#productStart

Abhi product section sirf starting placeholder hai.
Actual products tum jab bologe tab isi jagah add honge.
==================================================
*/

/* ================= MOBILE ================= */

@media(max-width:700px){

    .page{
        padding:6px 12px 18px;
    }

    .top-tabs{
        gap:16px;
        padding:44px 20px 58px;
    }

    .tab{
        height:88px;
        border-radius:24px;
        font-size:23px;
    }

    .tab .icon{
        font-size:34px;
        margin-right:10px;
    }

    .tab:first-child .icon{
        font-size:42px;
    }

    .home-row{
        gap:10px;
        margin-bottom:20px;
    }

    .home{
        height:76px;
        padding:0 25px;
        font-size:30px;
    }

    .home-pin{
        font-size:25px;
        margin-right:17px;
    }

    .small{
        height:76px;
        width:78px;
        border-radius:23px;
        font-size:27px;
    }

    .small:last-child{
        width:102px;
    }

    .search-row{
        gap:13px;
        margin-bottom:20px;
    }

    .search{
        height:96px;
        padding:0 25px;
        font-size:29px;
    }

    .search-icon{
        font-size:49px;
        margin-right:24px;
    }

    .mic{
        font-size:37px;
    }

    .qr{
        font-size:43px;
        width:48px;
    }

    .categories{
        gap:10px;
        padding:0 6px;
    }

    .cat{
        font-size:20px;
    }

    .cat-box{
        height:91px;
        border-radius:23px;
        font-size:45px;
        margin-bottom:11px;
    }

    .saimart-content{
        margin-top:25px;
    }

    .banner{
        min-height:190px;
        border-radius:16px;
    }

    .banner img{
        min-height:190px;
    }

    .banner-text{
        font-size:28px;
        width:92%;
    }

    .below-banner-text{
        padding:18px 10px 4px;
        font-size:22px;
    }

    .slider-section{
        margin-top:20px;
        border-radius:15px;
    }

    .banner-slider{
        gap:10px;
        animation-duration:10s;
    }

    .slider-banner{
        flex:0 0 calc(50% - 5px);
        height:125px;
        border-radius:13px;
    }

    .product-start{
        margin-top:30px;
        padding:22px 12px 45px;
        border-radius:18px;
    }

    .product-start-title{
        font-size:27px;
        margin-bottom:20px;
    }

    .product-placeholder{
        min-height:130px;
        font-size:19px;
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ================= TOP SECTION ================= -->

    <div class="top-tabs">

        <div class="tab">
            <span class="icon">S</span>
            Saimart
        </div>

        <div class="tab">
            <span class="icon">🏷️</span>
            Value 365
        </div>

        <div class="tab">
            <span class="icon">✈️</span>
            Travel
        </div>

    </div>


    <div class="home-row">

        <div class="home">
            <span class="home-pin">●</span>
            Home
        </div>

        <div class="small">🚀</div>

        <div class="small">⚡ 0</div>

    </div>


    <div class="search-row">

        <div class="search">
            <span class="search-icon">⌕</span>
            <span>mobiles</span>
            <span class="mic">♩</span>
        </div>

        <div class="qr">⌾</div>

    </div>


    <div class="categories">

        <div class="cat">
            <div class="cat-box">🛍</div>
            For You
        </div>

        <div class="cat">
            <div class="cat-box">👕</div>
            Fashion
        </div>

        <div class="cat">
            <div class="cat-box">▯</div>
            Mobiles
        </div>

        <div class="cat">
            <div class="cat-box">▣</div>
            Electronics
        </div>

        <div class="cat">
            <div class="cat-box">⌚</div>
            Beauty
        </div>

        <div class="cat">
            <div class="cat-box">⌂</div>
            Home
        </div>

    </div>


    <!-- ================= STEP 2 + 3 ================= -->

    <section class="saimart-content scroll-to-products"
             onclick="goToProducts()">

        <!-- MAIN BANNER -->
        <div class="banner">

            <img id="saimartBanner"
                 src="https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=1600&q=80"
                 alt="Saimart Banner">

            <!-- TEXT ON MAIN BANNER -->
            <div class="banner-text" id="bannerText">
                SAIMART BIG SALE
            </div>

        </div>


        <!-- TEXT BELOW MAIN BANNER -->
        <div class="below-banner-text" id="belowBannerText">
            Best Deals • Great Offers • Shop on Saimart
        </div>


        <!-- ================= TWO SLIDING BANNERS ================= -->

        <div class="slider-section">

            <div class="banner-slider">

                <!-- ORIGINAL SET -->
                <div class="slider-banner">
                    <img id="sliderBanner1"
                         src="https://images.unsplash.com/photo-1607083206968-13611e3d76db?auto=format&fit=crop&w=1000&q=80"
                         alt="Saimart Banner 1">
                </div>

                <div class="slider-banner">
                    <img id="sliderBanner2"
                         src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1000&q=80"
                         alt="Saimart Banner 2">
                </div>

                <!-- DUPLICATE SET FOR CONTINUOUS SLIDER -->
                <div class="slider-banner">
                    <img src="https://images.unsplash.com/photo-1607083206968-13611e3d76db?auto=format&fit=crop&w=1000&q=80"
                         alt="Saimart Banner 1">
                </div>

                <div class="slider-banner">
                    <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1000&q=80"
                         alt="Saimart Banner 2">
                </div>

            </div>

        </div>

    </section>


    <!-- ================= PRODUCT START ================= -->

    <section class="product-start" id="productStart">

        <div class="product-start-title">
            SAIMART PRODUCTS
        </div>

        <div class="product-placeholder">
            Product section yahan se start hoga.
            <br>
            Actual products tumhare next instruction ke according add honge.
        </div>

    </section>

</div>


<script>

/*
==================================================
CLICK → PRODUCT SECTION

Main banner, banner text, below-banner text
aur dono slider banners par click karne se
product section tak smooth scroll hoga.
==================================================
*/

function goToProducts(){

    const productSection = document.getElementById("productStart");

    if(productSection){

        productSection.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }

}

</script>

</body>
</html>
